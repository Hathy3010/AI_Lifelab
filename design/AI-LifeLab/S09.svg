<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>S09 Quan sát kết quả và thử lại</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F6F7F4" stroke="#D9E0DA"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#FCFDF9" stroke="#D9E0DA"/><text x="32" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#28765B" font-weight="700">AI LifeLab</text><text x="270" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#24332E" font-weight="400">Trang cá nhân</text><text x="515" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#24332E" font-weight="400">Thư viện</text><text x="760" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#24332E" font-weight="400">Trải nghiệm của mình</text><text x="1220" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#24332E" font-weight="400">Minh Anh · 8A</text><text x="48" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64716B" font-weight="600">STUDENT / S09</text><text x="48" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#24332E" font-weight="650">Quan sát kết quả và thử lại</text><text x="48" y="219" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#64716B" font-weight="400">Lần thử 02 · Kết quả minh họa, chưa phải mô hình vật lý đã kiểm chứng.</text><rect x="48" y="265" width="850" height="260" rx="10" fill="#FCFDF9" stroke="#D9E0DA"/><text x="72" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#24332E" font-weight="600">Kết quả mô phỏng</text><text x="72" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">Cầu chưa đáp ứng tải trọng mục tiêu.</text><text x="72" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">Vùng giữa cầu cần được quan sát thêm.</text><rect x="72" y="460" width="260" height="46" rx="8" fill="#28765B" stroke="#D9E0DA"/><text x="88" y="489" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#F6F7F4" font-weight="600">Quay lại thiết kế</text><rect x="48" y="553" width="850" height="300" rx="10" fill="#FCFDF9" stroke="#D9E0DA"/><text x="72" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#24332E" font-weight="600">So với lần trước</text><text x="72" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">Bạn đã thay đổi vị trí một thanh giằng.</text><text x="72" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">So sánh tải trọng, độ võng và chi phí.</text><rect x="72" y="788" width="260" height="46" rx="8" fill="#28765B" stroke="#D9E0DA"/><text x="88" y="817" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#F6F7F4" font-weight="600">So sánh hai lần thử</text><rect x="930" y="265" width="462" height="588" rx="10" fill="#FCFDF9" stroke="#D9E0DA"/><text x="954" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#24332E" font-weight="600">AI Coach</text><text x="954" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">Thay đổi nào có thể ảnh hưởng kết quả?</text><text x="954" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">Bạn muốn giữ hay điều chỉnh phần nào?</text><rect x="954" y="788" width="260" height="46" rx="8" fill="#28765B" stroke="#D9E0DA"/><text x="970" y="817" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#F6F7F4" font-weight="600">Sang bước phản tư</text><text x="48" y="965" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64716B" font-weight="400">AI LifeLab · Khung UX desktop 1440 × 1000 · Nội dung và dữ liệu minh họa</text></svg>