<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>T04 Chi tiết và xem trước hoạt động</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F6F7F4" stroke="#D9E0DA"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#FCFDF9" stroke="#D9E0DA"/><text x="32" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#28765B" font-weight="700">AI LifeLab</text><text x="270" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#24332E" font-weight="400">Tổng quan</text><text x="515" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#24332E" font-weight="400">Lớp &amp; nhiệm vụ</text><text x="760" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#24332E" font-weight="400">Thư viện hoạt động</text><text x="1220" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#24332E" font-weight="400">Cô Lan</text><text x="48" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64716B" font-weight="600">TEACHER / T04</text><text x="48" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#24332E" font-weight="650">Chi tiết và xem trước hoạt động</text><text x="48" y="219" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#64716B" font-weight="400">Thiết kế cầu chịu tải · Kịch bản có sẵn</text><rect x="48" y="265" width="850" height="260" rx="10" fill="#FCFDF9" stroke="#D9E0DA"/><text x="72" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#24332E" font-weight="600">Kiến thức và yêu cầu cần đạt</text><text x="72" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">Nhận biết tác động của lựa chọn kết cấu.</text><text x="72" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">Dùng dữ kiện để giải thích điều chỉnh.</text><rect x="72" y="460" width="260" height="46" rx="8" fill="#28765B" stroke="#D9E0DA"/><text x="88" y="489" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#F6F7F4" font-weight="600">Xem trước trải nghiệm</text><rect x="48" y="553" width="850" height="300" rx="10" fill="#FCFDF9" stroke="#D9E0DA"/><text x="72" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#24332E" font-weight="600">Nội dung hoạt động</text><text x="72" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">03 thử thách · Có phản tư và bằng chứng</text><text x="72" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">Hỗ trợ chuột, cử chỉ và quét sơ đồ.</text><rect x="72" y="788" width="260" height="46" rx="8" fill="#28765B" stroke="#D9E0DA"/><text x="88" y="817" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#F6F7F4" font-weight="600">Chọn để giao</text><rect x="930" y="265" width="462" height="588" rx="10" fill="#FCFDF9" stroke="#D9E0DA"/><text x="954" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#24332E" font-weight="600">Phạm vi điều chỉnh</text><text x="954" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">Được sửa hướng dẫn, mục tiêu, tiêu chí.</text><text x="954" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">Quy tắc mô phỏng được giữ theo kịch bản.</text><rect x="954" y="788" width="260" height="46" rx="8" fill="#28765B" stroke="#D9E0DA"/><text x="970" y="817" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#F6F7F4" font-weight="600">Xem tiêu chí gốc</text><text x="48" y="965" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64716B" font-weight="400">AI LifeLab · Khung UX desktop 1440 × 1000 · Nội dung và dữ liệu minh họa</text></svg>