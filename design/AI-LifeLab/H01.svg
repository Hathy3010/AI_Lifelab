<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>H01 Trang chủ</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F6F7F4" stroke="#D9E0DA"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#FCFDF9" stroke="#D9E0DA"/><text x="32" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#28765B" font-weight="700">AI LifeLab</text><text x="270" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#24332E" font-weight="400">Trang chủ</text><text x="515" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#24332E" font-weight="400">Khám phá</text><text x="760" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#24332E" font-weight="400">Hướng dẫn</text><text x="1220" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#24332E" font-weight="400">Đăng nhập</text><text x="48" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64716B" font-weight="600">HOME / H01</text><text x="48" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#24332E" font-weight="650">Trang chủ</text><text x="48" y="219" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#64716B" font-weight="400">Thử ý tưởng. Quan sát kết quả. Hiểu mình hơn.</text><rect x="48" y="265" width="850" height="260" rx="10" fill="#FCFDF9" stroke="#D9E0DA"/><text x="72" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#24332E" font-weight="600">Trải nghiệm điều khó làm ngoài đời</text><text x="72" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">Thiết kế, thử nghiệm và tự tìm cách giải quyết.</text><text x="72" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">Dành cho học sinh lớp 8 và lớp 9.</text><rect x="72" y="460" width="260" height="46" rx="8" fill="#28765B" stroke="#D9E0DA"/><text x="88" y="489" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#F6F7F4" font-weight="600">Khám phá trải nghiệm</text><rect x="48" y="553" width="850" height="300" rx="10" fill="#FCFDF9" stroke="#D9E0DA"/><text x="72" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#24332E" font-weight="600">Bắt đầu như thế nào?</text><text x="72" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">01 Hiểu nhiệm vụ → 02 Tự thực hiện</text><text x="72" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">03 Quan sát → 04 Thử lại và phản tư</text><rect x="72" y="788" width="260" height="46" rx="8" fill="#28765B" stroke="#D9E0DA"/><text x="88" y="817" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#F6F7F4" font-weight="600">Xem hướng dẫn</text><rect x="930" y="265" width="462" height="588" rx="10" fill="#FCFDF9" stroke="#D9E0DA"/><text x="954" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#24332E" font-weight="600">Trải nghiệm tiêu biểu</text><text x="954" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">Thiết kế cầu chịu tải · Khoa học &amp; kỹ thuật</text><text x="954" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">Ứng phó ngập lụt · Ra quyết định</text><rect x="954" y="788" width="260" height="46" rx="8" fill="#28765B" stroke="#D9E0DA"/><text x="970" y="817" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#F6F7F4" font-weight="600">Xem kịch bản</text><text x="48" y="965" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64716B" font-weight="400">AI LifeLab · Khung UX desktop 1440 × 1000 · Nội dung và dữ liệu minh họa</text></svg>