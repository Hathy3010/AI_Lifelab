<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>S01 Trang cá nhân</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F6F7F4" stroke="#D9E0DA"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#FCFDF9" stroke="#D9E0DA"/><text x="32" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#28765B" font-weight="700">AI LifeLab</text><text x="270" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#24332E" font-weight="400">Trang cá nhân</text><text x="515" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#24332E" font-weight="400">Thư viện</text><text x="760" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#24332E" font-weight="400">Trải nghiệm của mình</text><text x="1220" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#24332E" font-weight="400">Minh Anh · 8A</text><text x="48" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64716B" font-weight="600">STUDENT / S01</text><text x="48" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#24332E" font-weight="650">Trang cá nhân</text><text x="48" y="219" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#64716B" font-weight="400">Chào Minh Anh, tiếp tục ý tưởng còn dang dở nhé.</text><rect x="48" y="265" width="850" height="260" rx="10" fill="#FCFDF9" stroke="#D9E0DA"/><text x="72" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#24332E" font-weight="600">Đang thực hiện</text><text x="72" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">Thiết kế cầu chịu tải · Thử thách 2/3</text><text x="72" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#64716B" font-weight="400">Bản thiết kế đã lưu · Còn bước thử tải</text><rect x="72" y="460" width="260" height="46" rx="8" fill="#28765B" stroke="#D9E0DA"/><text x="88"