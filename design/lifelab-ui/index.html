const select=document.querySelector('select');for(const s of scenes){const o=document.createElement('option');o.value=s.code;o.textContent=s.code+' · '+s.title;select.appendChild(o)}select.addEventListener('change',()=>location.hash=select.value);
const main=document.querySelector('main');const params=new URLSearchParams(location.search);if(params.has('capture'))document.body.classList.add('capture');
function bindInputs(){document.querySelectorAll('[data-field]').forEach(el=>{try{const saved=localStorage.getItem('lifelab-'+el.dataset.field);if(saved)el.value=saved}catch{}el.addEventListener('input',()=>{try{localStorage.setItem('lifelab-'+el.dataset.field,el.value)}catch{}})})}
function render(){let code=location.hash.slice(1)||'H01';if(!params.has('capture')&&!/-[MT]$/.test(code)){const device=innerWidth<641?'M':innerWidth<1100?'T':null;if(device&&scenes.some(s=>s.code===code+'-'+device))code+='-'+device;}const current=scenes.find(s=>s.code===code)||scenes[0];window.activeScene=current;select.value=current.code;main.innerHTML='<div class="stage"><section class="screen" style="width:'+current.w+'px;height:'+current.h+'px" aria-label="'+current.title+'">'+html[current.code]+'</section></div>';resize();bindInputs();document.title=current.title+' · AI LifeLab';window.scrollTo(0,0)}
function resize(){const stage=document.querySelector('.stage'),screen=document.querySelector('.screen'),s=window.activeScene;if(!stage||!s)return;const scale=params.has('capture')?1:Math.min(1,(innerWidth-24)/s.w);stage.style.width=(s.w*scale)+'px';stage.style.height=(s.h*scale)+'px';screen.style.transform='scale('+scale+')'}
window.addEventListener('hashchange',render);window.addEventListener('resize',resize);render();window.LIFELAB_SCENES=scenes;
document.addEventListener('click',ev=>{const a=ev.target.closest('a');if(!a)return;if(a.textContent.includes('Giao cho lớp')){const t=document.createElement('div');t.className='toast';t.textContent='Đã giao nhiệm vụ cho lớp 8A (trạng thái prototype)';document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}});</script></body></html>
