<text x="600.0" y="1310.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Chỉ nắm khi vật chưa bị tay khác giữ. Mỗi tay một state machine; khóa vật dùng chung. Mất tay, đổi phương thức hoặc theo dõi mơ hồ đều hủy.</text>
