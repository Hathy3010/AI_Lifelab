<rect x="440" y="520" width="280" height="70" rx="12" fill="#F4FAFF" stroke="#7399B7" stroke-width="1.5" />
<text x="580.0" y="560.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Đặt mục tiêu, hướng dẫn và thời hạn</text>
<rect x="440" y="650" width="280" height="70" rx="12" fill="#F4FAFF" stroke="#7399B7" stroke-width="1.5" />
<text x="580.0" y="680.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Xác nhận giao bài → Lưu danh sách</text>
<text x="580.0" y="699.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">nhận</text>
<rect x="440" y="850" width="280" height="70" rx="12" fill="#F4FAFF" stroke="#7399B7" stroke-width="1.5" />
<text x="580.0" y="890.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Xem tiến độ tham gia / hoàn thành</text>
<rect x="440" y="980" width="280" height="70" rx="12" fill="#F4FAFF" stroke="#7399B7" stroke-width="1.5" />
<text x="580.0" y="1020.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Chọn học sinh và phiên cần xem</text>
<polygon points="580.0,1110 720,1160.0 580.0,1210 440,1160.0" fill="#FFF7E6" stroke="#B89958" stroke-width="1.5"/>
<text x="580.0" y="1165.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Có dữ liệu bài làm?</text>
<rect x="440" y="1330" width="280" height="70" rx="12" fill="#F4FAFF" stroke="#7399B7" stroke-width="1.5" />
<text x="580.0" y="1360.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Xem dự đoán, lượt thử và phản tư nếu</text>
<text x="580.0" y="1379.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">có</text>
<rect x="440" y="1460" width="280" height="70" rx="12" fill="#F4FAFF" stroke="#7399B7" stroke-width="1.5" />
<text x="580.0" y="1500.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Đối chiếu bằng chứng → Viết nhận xét</text>
<rect x="440" y="1590" width="280" height="70" rx="12" fill="#F4FAFF" stroke="#7399B7" stroke-width="1.5" />
<text x="580.0" y="1630.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Lưu nhận xét riêng của giáo viên</text>
<polygon points="580.0,1730 720,1780.0 580.0,1830 440,1780.0" fill="#FFF7E6" stroke="#B89958" stroke-width="1.5"/>
<text x="580.0" y="1785.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Tiếp tục theo dõi?</text>
<ellipse cx="580.0" cy="1975.0" rx="140.0" ry="35.0" fill="#E8F8F1" stroke="#679982" stroke-width="1.5"/>
<text x="580.0" y="1980.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Kết thúc</text>
<rect x="800" y="1130" width="300" height="90" rx="12" fill="#F4FAFF" stroke="#7399B7" stroke-width="1.5" />
<text x="950.0" y="1180.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Chưa bắt đầu: chưa kết luận về năng lực</text>
<rect x="70" y="360" width="280" height="130" rx="12" fill="#FFFFFF" stroke="#ADBCC7" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="210.0" y="411.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Một học sinh một tài khoản từ danh</text>
<text x="210.0" y="430.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">sách đã kiểm tra. Đổi lớp / đặt lại</text>
<text x="210.0" y="449.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">mật khẩu giữ nguyên tài khoản.</text>
<rect x="70" y="720" width="280" height="130" rx="12" fill="#FFFFFF" stroke="#ADBCC7" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="210.0" y="771.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Không có quyền: không mở dữ liệu. Lỗi</text>
<text x="210.0" y="790.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">giao / lưu: báo chưa thành công, cho</text>
<text x="210.0" y="809.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">thử lại chống trùng.</text>
<rect x="800" y="1450" width="300" height="130" rx="12" fill="#FFFFFF" stroke="#ADBCC7" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="950.0" y="1501.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Theo dõi dữ liệu đã lưu; không xem</text>
<text x="950.0" y="1520.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">camera trực tiếp. Nhận xét AI là hỗ trợ,</text>
<text x="950.0" y="1539.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">giáo viên tự nhận định.</text>
