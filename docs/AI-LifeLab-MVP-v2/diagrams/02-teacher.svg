<text x="580.0" y="300.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Đăng nhập → Chọn lớp phụ trách</text>
<rect x="440" y="390" width="280" height="70" rx="12" fill="#F4FAFF" stroke="#7399B7" stroke-width="1.5" />
