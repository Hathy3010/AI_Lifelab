<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1470" viewBox="0 0 1200 1470">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#607B8E"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="40" y="67" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#17354A">ERD C · Chat Coach và nguồn tham chiếu</text>
<text x="40" y="104" font-family="Arial,sans-serif" font-size="14" fill="#607B8E">AI LifeLab · MVP v2 · 05/11/2026 · Bản thiết kế</text>
<polyline points="340,270.0 430,270.0" fill="none" stroke="#607B8E" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="356.0" y="258.0" width="58" height="24" fill="white"/><text x="385.0" y="275.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#17354A">1:0..N</text>
<polyline points="600.0,380 600.0,780" fill="none" stroke="#607B8E" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="571.0" y="568.0" width="58" height="24" fill="white"/><text x="600.0" y="585.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#17354A">1:0..4</text>
<polyline points="820,880.0 770,880.0" fill="none" stroke="#607B8E" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="766.0" y="868.0" width="58" height="24" fill="white"/><text x="795.0" y="885.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#17354A">1:0..N</text>
<rect x="40" y="160" width="300" height="220" rx="12" fill="#E8F8F1" stroke="#679982" stroke-width="1.5" />
<text x="190.0" y="246.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">sessions</text>
<text x="190.0" y="265.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">PK id</text>
<text x="190.0" y="284.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Chủ phiên và cấu hình bài</text>
<text x="190.0" y="303.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Chi tiết ở trang ERD B</text>
<rect x="430" y="160" width="340" height="220" rx="12" fill="#E8F8F1" stroke="#679982" stroke-width="1.5" />
<text x="600.0" y="227.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">coach_turns</text>
<text x="600.0" y="246.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">PK id · FK session_id</text>
<text x="600.0" y="265.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">question / answer · mode</text>
<text x="600.0" y="284.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">context_snapshot / hash</text>
<text x="600.0" y="303.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">PENDING → READY · generation</text>
<text x="600.0" y="322.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">prompt / model · fallback</text>
<rect x="430" y="780" width="340" height="200" rx="12" fill="#E8F8F1" stroke="#679982" stroke-width="1.5" />
<text x="600.0" y="847.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">coach_turn_sources</text>
<text x="600.0" y="866.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">PK coach_turn_id + attempt_id</text>
<text x="600.0" y="885.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">FK coach_turn_id + session_id</text>
<text x="600.0" y="904.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">FK attempt_id + session_id</text>
<text x="600.0" y="923.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">source_order: 1–4, không trùng</text>
<rect x="820" y="780" width="340" height="200" rx="12" fill="#E8F8F1" stroke="#679982" stroke-width="1.5" />
<text x="990.0" y="856.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">attempts</text>
<text x="990.0" y="875.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">PK id · UNIQUE id + session_id</text>
<text x="990.0" y="894.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">input_json / result_json</text>
<text x="990.0" y="913.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Chi tiết ở trang ERD B</text>
<rect x="40" y="1110" width="1120" height="130" rx="12" fill="#FFFFFF" stroke="#ADBCC7" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="600.0" y="1170.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Một câu hỏi dùng 0..4 lượt thử. Một lượt thử có thể được nhiều câu hỏi tham chiếu. FK ghép cùng session_id ngăn lấy nguồn của phiên khác. PREDICT trước</text>
<text x="600.0" y="1189.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">chạy có thể chưa có nguồn attempts nhưng luôn có snapshot phương án.</text>
<rect x="40" y="1280" width="1120" height="130" rx="12" fill="#FFFFFF" stroke="#ADBCC7" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="600.0" y="1340.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Giao dịch ngắn: tạo PENDING + nguồn → COMMIT → gọi LLM → kiểm đầu ra → cập nhật READY nếu generation còn khớp. Lỗi model vẫn lưu READY với</text>
<text x="600.0" y="1359.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">fallback=true. Không giữ khóa SQL trong lúc chờ LLM.</text>
</svg>