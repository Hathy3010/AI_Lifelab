<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1000" viewBox="0 0 1380 1000"><title>AI LifeLab / Một lượt thử 8.1 và hoàn thành</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3B82F6"/></marker></defs><rect width="1380" height="1000" fill="#f4faff"/><text x="28" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="650" fill="#17365E">AI LifeLab / Một lượt thử 8.1 và hoàn thành</text><rect x="15" y="82" width="150" height="52" rx="12" fill="#E5F1FF" stroke="#bdd3e6"/><text x="27" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#17365E">Học sinh</text><path d="M90 134V936" stroke="#bdd3e6" stroke-dasharray="5 6"/><rect x="255" y="82" width="150" height="52" rx="12" fill="#E5F1FF" stroke="#bdd3e6"/><text x="267" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#17365E">Web / CV</text><path d="M330 134V936" stroke="#bdd3e6" stroke-dasharray="5 6"/><rect x="515" y="82" width="150" height="52" rx="12" fill="#E5F1FF" stroke="#bdd3e6"/><text x="527" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#17365E">Backend</text><path d="M590 134V936" stroke="#bdd3e6" stroke-dasharray="5 6"/><rect x="770" y="82" width="150" height="52" rx="12" fill="#E5F1FF" stroke="#bdd3e6"/><text x="782" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#17365E">Simulation</text><path d="M845 134V936" stroke="#bdd3e6" stroke-dasharray="5 6"/><rect x="1010" y="82" width="150" height="52" rx="12" fill="#E5F1FF" stroke="#bdd3e6"/><text x="1022" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#17365E">PostgreSQL</text><path d="M1085 134V936" stroke="#bdd3e6" stroke-dasharray="5 6"/><rect x="1210" y="82" width="150" height="52" rx="12" fill="#E5F1FF" stroke="#bdd3e6"/><text x="1222" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#17365E">LLM</text><path d="M1285 134V936" stroke="#bdd3e6" stroke-dasharray="5 6"/><polyline points="90,182 330,182" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="100" y="172" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">1. Chọn 70 cm, chạy</text><polyline points="330,239 590,239" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="340" y="229" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">2. Input + request ID</text><polyline points="590,296 1085,296" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">3. Khóa phiên; kiểm tra trùng/quyền</text><polyline points="590,353 845,353" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="343" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">4. Tính từ cấu hình v1</text><polyline points="845,410 590,410" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">5. A: phút 5; B: CLEAR</text><polyline points="590,467 1085,467" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="457" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">6. Lưu attempt; COMMIT</text><polyline points="590,524 330,524" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="340" y="514" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">7. Kết quả đã lưu</text><polyline points="330,581 590,581" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="340" y="571" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">8. Đổi 60 cm, chạy với ID mới</text><polyline points="590,638 1085,638" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="628" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">9. Lưu lượt mới; giữ lượt cũ</text><polyline points="330,695 590,695" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="340" y="685" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">10. Chọn lượt + phản tư cuối</text><polyline points="590,752 1085,752" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="742" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">11. Chốt phản tư, quan sát, COMPLETED</text><polyline points="590,809 330,809" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="340" y="799" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">12. Trả hoàn thành, không chờ AI</text><polyline points="590,866 1285,866" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="856" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">13. Khi UI yêu cầu feedback riêng</text><polyline points="1285,923 590,923" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="913" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">14. JSON hoặc fallback sau 10s</text></svg>