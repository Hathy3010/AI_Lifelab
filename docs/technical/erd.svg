text><polyline points="570,790 570,884" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="588" y="843" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">1:0..1 phản tư</text><polyline points="970,790 970,884" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="987" y="842" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">Nguồn lượt thử</text><polyline points="710,982 830,982" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="720" y="968" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">Nguồn phản tư</text><polyline points="430,710 310,710" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="326" y="695" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">1:N góp ý</text><polyline points="170,240 170,560 410,560 410,642 430,642" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="214" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">Chủ phiên</text><rect x="30" y="92" width="280" height="148" rx="15" fill="#EAF6F8" stroke="#bdd3e6"/><text x="48" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#17365E">users</text><text x="48" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">PK id</text><text x="48" y="183" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">role / grade / auth_epoch</text><rect x="430" y="92" width="280" height="148" rx="15" fill="#EAF6F8" stroke="#bdd3e6"/><text x="448" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#17365E">classes</text><text x="448" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">PK id</text><text x="448" y="183" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">FK teacher_id → users</text><rect x="830" y="92" width="320" height="148" rx="15" fill="#EAF6F8" stroke="#bdd3e6"/><text x="848" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#17365E">enrollments</text><text x="848" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">PK class_id + student_id</text><text x="848" y="183" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">FK classes / users</text><rect x="430" y="324" width="280" height="156" rx="15" fill="#FFF7E6" stroke="#bdd3e6"/><text x="448" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#17365E">assignments</text><text x="448" y="390" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">PK id</text><text x="448" y="415" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">FK class_id + teacher_id</text><text x="448" y="440" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">scenario / versions / due_at</text><rect x="830" y="324" width="320" height="156" rx="15" fill="#FFF7E6" stroke="#bdd3e6"/><text x="848" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#17365E">assignment_recipients</text><text x="848" y="390" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">PK assignment_id + student_id</text><text x="848" y="415" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">FK assignment + enrollment</text><text x="848" y="440" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Snapshot tại thời điểm giao</text><rect x="430" y="594" width="280" height="196" rx="15" fill="#E8F8F1" stroke="#bdd3e6"/><text x="448" y="627" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#17365E">sessions</text><text x="448" y="660" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">PK id; FK student_id</text><text x="448" y="685" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">FK assignment + recipient</text><text x="448" y="710" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">status / draft / revision</text><text x="448" y="735" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">versions / event_applied</text><rect x="830" y="594" width="320" height="196" rx="15" fill="#E8F8F1" stroke="#bdd3e6"/><text x="848" y="627" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#17365E">attempts</text><text x="848" y="660" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">PK id; FK session_id</text><text x="848" y="685" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">UNIQUE session + request_id</text><text x="848" y="710" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">input / result / phase</text><text x="848" y="735" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Bất biến</text><rect x="30" y="624" width="280" height="166" rx="15" fill="#FCE8EE" stroke="#bdd3e6"/><text x="48" y="657" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#17365E">teacher_reviews</text><text x="48" y="690" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">PK id; FK session / teacher</text><text x="48" y="715" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Góp ý riêng, có nguồn</text><text x="48" y="740" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Không thay lời học sinh</text><rect x="430" y="884" width="280" height="196" rx="15" fill="#EAF6F8" stroke="#bdd3e6"/><text x="448" y="917" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#17365E">reflections</text><text x="448" y="950" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">PK id; UNIQUE session_id</text><text x="448" y="975" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">FK selected_attempt + session</text><text x="448" y="1000" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Phản tư cuối; bất biến</text><rect x="830" y="884" width="320" height="196" rx="15" fill="#EAF6F8" stroke="#bdd3e6"/><text x="848" y="917" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#17365E">evidence</text><text x="848" y="950" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">PK id; FK session</text><text x="848" y="975" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">FK lượt thử + phản tư cùng phiên</text><text x="848" y="1000" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">UNIQUE session + criterion</text><text x="848" y="1025" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Quan sát / đề xuất AI</text><text x="30" y="1152" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#17365E">Bổ sung ở SQL: cùng phiên khi tham chiếu nguồn, phiên bản assignment, recipient và chống ghi trùng.</text><text x="30" y="1187" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#17365E">Backend kiểm tra vai trò, khối lớp, quyền chủ sở hữu và điều kiện hoàn thành trong giao dịch.</text><text x="30" y="1222" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#17365E">Không xóa enrollment/snapshot để thay đổi tiến độ bài đã giao; đổi thành viên bằng cờ active.</text></svg>