<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740"><title>AI LifeLab / Kiến trúc MVP</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3B82F6"/></marker></defs><rect width="1240" height="740" fill="#f4faff"/><text x="28" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="650" fill="#17365E">AI LifeLab / Kiến trúc MVP</text><rect x="30" y="93" width="350" height="245" rx="15" fill="#E8F8F1" stroke="#bdd3e6"/><text x="48" y="126" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#17365E">Thiết bị người dùng</text><text x="48" y="159" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">React + TypeScript</text><text x="48" y="184" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">UI học sinh / giáo viên</text><text x="48" y="209" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">MediaPipe + bộ chuyển cử chỉ</text><text x="48" y="234" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Camera xử lý tại đây</text><text x="48" y="259" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Chuột / bàn phím thay thế</text><rect x="466" y="93" width="370" height="245" rx="15" fill="#EAF6F8" stroke="#bdd3e6"/><text x="484" y="126" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#17365E">Một backend FastAPI</text><text x="484" y="159" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Xác thực + quyền + API</text><text x="484" y="184" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Simulation: 6 bộ quy tắc</text><text x="484" y="209" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Lưu nháp / lượt thử / hoàn thành</text><text x="484" y="234" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">AI adapter + kiểm tra output</text><text x="484" y="259" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Không nhận video để tính mô phỏng</text><rect x="922" y="93" width="288" height="245" rx="15" fill="#FFF7E6" stroke="#bdd3e6"/><text x="940" y="126" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#17365E">PostgreSQL</text><text x="940" y="159" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">10 bảng quan hệ</text><text x="940" y="184" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Snapshot danh sách được giao</text><text x="940" y="209" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Lượt thử / phản tư bất biến</text><text x="940" y="234" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">FK và ràng buộc duy nhất</text><polyline points="380,192 465,192" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="395" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">JSON</text><polyline points="836,192 921,192" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="850" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">Lưu/đọc</text><rect x="466" y="436" width="370" height="190" rx="15" fill="#FCE8EE" stroke="#bdd3e6"/><text x="484" y="469" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#17365E">Dịch vụ LLM ngoài</text><text x="484" y="502" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Nhận ngữ cảnh tối thiểu</text><text x="484" y="527" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Coach / gợi ý nhận xét</text><text x="484" y="552" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Không tính kết quả mô phỏng</text><rect x="30" y="436" width="350" height="190" rx="15" fill="#E5F1FF" stroke="#bdd3e6"/><text x="48" y="469" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#17365E">Cấu hình bài v1</text><text x="48" y="502" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">6 bài + dữ liệu + input schema</text><text x="48" y="527" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Bộ quy tắc Python có phiên bản</text><text x="48" y="552" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#17365E">Câu hỏi dự phòng; hash cấu hình</text><polyline points="380,525 420,525 420,290 465,290" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="662" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">Đọc cấu hình</text><polyline points="650,338 650,435" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/><text x="666" y="385" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#17365E">Context / JSON, timeout 10s</text><text x="30" y="708" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#17365E">AI lỗi vẫn trả kết quả mô phỏng. Không dùng microservices, hàng đợi hoặc ML đề xuất riêng trong MVP.</text></svg>