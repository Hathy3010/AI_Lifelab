<text x="965.0" y="1580.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">án đã chốt, chưa có kết quả thì không tự</text>
<text x="965.0" y="1599.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">tạo kết quả.</text>
