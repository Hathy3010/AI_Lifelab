<text x="965.0" y="410.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">và vật đang giữ. Không gửi từng khung</text>
<text x="965.0" y="429.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">hình.</text>
