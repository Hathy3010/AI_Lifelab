<text x="580.0" y="2106.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">tư</text>
<rect x="440" y="2170" width="280" height="64" rx="14" fill="#F4FAFF" stroke="#6897BC" stroke-width="1.5" />
<text x="580.0" y="2197.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Gửi hoàn thành; lưu phản tư và</text>
<text x="580.0" y="2216.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">bằng chứng</text>
