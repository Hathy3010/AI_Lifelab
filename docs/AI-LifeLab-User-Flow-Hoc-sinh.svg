<text x="195.0" y="761.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Bài 8.2: có thể dùng camera. Từ</text>
<text x="195.0" y="780.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">chối quyền hoặc nhận dạng sai →</text>
<text x="195.0" y="799.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">dùng chuột / bàn phím.</text>
<rect x="55" y="1500" width="280" height="120" rx="14" fill="#FFFFFF" stroke="#B2BCC8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="195.0" y="1546.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Thoát giữa chừng: chỉ báo Đã lưu</text>
<text x="195.0" y="1565.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">khi máy chủ xác nhận. Khi quay</text>
<text x="195.0" y="1584.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">lại, tiếp tục từ bản đã lưu.</text>
<rect x="55" y="2060" width="280" height="130" rx="14" fill="#FFFFFF" stroke="#B2BCC8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="195.0" y="2101.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Cách đọc: xanh nhạt = bước thao</text>
<text x="195.0" y="2120.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">tác; vàng = câu hỏi; xanh lá =</text>
<text x="195.0" y="2139.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">bắt đầu / kết thúc; đỏ nhạt = lỗi</text>
<text x="195.0" y="2158.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">cần xử lý.</text>
