<polygon points="580.0,1430 720,1480.0 580.0,1530 440,1480.0" fill="#FFF7E6" stroke="#C49843" stroke-width="1.5"/>
<text x="580.0" y="1485.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">Lưu thành công?</text>
