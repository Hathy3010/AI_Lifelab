<text x="990.0" y="1071.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">AI Coach (tùy chọn): gợi ý hoặc</text>
<text x="990.0" y="1090.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17354A">đặt câu hỏi; lỗi AI dùng gợi ý có</text>
